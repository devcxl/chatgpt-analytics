name: Build Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild as a draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT generated types
        run: npx wxt prepare

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Check tag version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag format: $RELEASE_TAG"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $package_version"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build & package Chrome
        run: npm run zip:chrome

      - name: Build & package Firefox
        run: npm run zip:firefox

      - name: Verify manifests
        run: ./scripts/verify-manifest.sh

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          CHROME_ZIPS=(.output/*-chrome.zip)
          FIREFOX_ZIPS=(.output/*-firefox.zip)
          SOURCE_ZIPS=(.output/*-sources.zip)
          if [ "${#CHROME_ZIPS[@]}" -ne 1 ] || [ "${#FIREFOX_ZIPS[@]}" -ne 1 ] || [ "${#SOURCE_ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Chrome ZIP, one Firefox ZIP, and one source ZIP"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG".."$RELEASE_TAG" --oneline --no-decorate)
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/$PREV_TAG...$RELEASE_TAG"
          else
            NOTES=$(git log "$RELEASE_TAG" --oneline --no-decorate)
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/$RELEASE_TAG"
          fi
          {
            echo 'notes<<RELEASE_NOTES_END'
            echo "$NOTES"
            echo
            echo "Full diff: $COMPARE_URL"
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
