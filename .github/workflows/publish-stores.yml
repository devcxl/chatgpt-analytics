name: Publish Extension Stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to submit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stores-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

      - name: Validate store configuration and assets
        id: stores
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          shopt -s nullglob
          CHROME_ZIPS=(release-assets/*-chrome.zip)
          FIREFOX_ZIPS=(release-assets/*-firefox.zip)
          SOURCE_ZIPS=(release-assets/*-sources.zip)
          CHROME_READY=false
          FIREFOX_READY=false

          if [ -n "$CHROME_EXTENSION_ID$CHROME_PUBLISHER_ID$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            if [ -z "$CHROME_EXTENSION_ID" ] || [ -z "$CHROME_PUBLISHER_ID" ] || [ -z "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] || [ -z "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
              echo "::error::Chrome store credentials are incomplete"
              exit 1
            fi
            if [ "${#CHROME_ZIPS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one Chrome ZIP asset, found ${#CHROME_ZIPS[@]}"
              exit 1
            fi
            CHROME_READY=true
            echo "chrome_zip=${CHROME_ZIPS[0]}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$FIREFOX_EXTENSION_ID$FIREFOX_JWT_ISSUER$FIREFOX_JWT_SECRET" ]; then
            if [ -z "$FIREFOX_EXTENSION_ID" ] || [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
              echo "::error::Firefox store credentials are incomplete"
              exit 1
            fi
            if [ "${#FIREFOX_ZIPS[@]}" -ne 1 ] || [ "${#SOURCE_ZIPS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one Firefox ZIP and one source ZIP asset"
              exit 1
            fi
            FIREFOX_READY=true
            echo "firefox_zip=${FIREFOX_ZIPS[0]}" >> "$GITHUB_OUTPUT"
            echo "source_zip=${SOURCE_ZIPS[0]}" >> "$GITHUB_OUTPUT"
          fi

          if [ "$CHROME_READY" = "false" ] && [ "$FIREFOX_READY" = "false" ]; then
            echo "::error::No complete browser store credentials are configured"
            exit 1
          fi

          echo "chrome=$CHROME_READY" >> "$GITHUB_OUTPUT"
          echo "firefox=$FIREFOX_READY" >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        if: ${{ steps.stores.outputs.chrome == 'true' }}
        env:
          # 凭证走环境变量传给 publish-extension，避免私钥出现在命令行参数里。
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          # 私钥必须是带真实换行的 PEM。配置方式：
          #   jq -r .private_key key.json | gh secret set CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
          # 常见错误是拷贝 JSON 里的字面量 \n，签名时会报
          # "DECODER routines::unsupported"，此处提前拦截。
          if ! printf '%s' "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" | grep -q '^-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::CHROME_SERVICE_ACCOUNT_PRIVATE_KEY 不是 PEM（应以 -----BEGIN PRIVATE KEY----- 开头）。请用 jq -r .private_key 重新配置。"
            exit 1
          fi

          # Chrome Web Store API v1.1 已于 2026-10-15 停用，这里固定走 v2：
          # 认证用 GCP 服务账号（需在开发者后台绑定，每个发布者仅限一个）。
          # 版本由 npx 显式指定：本 workflow 检出的是发布 tag，tag 内的 node_modules
          # 不一定装了这个 CLI，或装的版本与仓库当前锁定值不同，不能依赖本地 bin 解析。
          npx --yes 'publish-browser-extension@^6.1.0' \
            --chrome-zip "${{ steps.stores.outputs.chrome_zip }}" \
            --chrome-api-version v2 \
            --chrome-skip-submit-review

      - name: Submit to Firefox Add-ons (AMO)
        if: ${{ steps.stores.outputs.firefox == 'true' }}
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx wxt submit \
            --firefox-zip "${{ steps.stores.outputs.firefox_zip }}" \
            --firefox-sources-zip "${{ steps.stores.outputs.source_zip }}" \
            --firefox-channel listed
